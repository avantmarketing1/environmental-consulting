[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enviro-comply"
version = "0.1.0"
description = "Automated Australian council environmental compliance & OSSM engineering engine (Lismore City Council NSW)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "ezdxf>=1.3",
    "python-docx>=1.1",
    "docxtpl>=0.18",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
enviro-comply = "enviro_comply.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
